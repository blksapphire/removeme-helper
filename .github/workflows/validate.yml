name: Validate RemoveMe Helper

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "feature/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server/index.mjs
      - name: Test service logic
        run: npm test
      - name: Build web app
        run: npm run build
