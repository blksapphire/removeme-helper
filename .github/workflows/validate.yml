name: Validate RemoveMe Helper

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "feature/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Install service dependencies
        run: npm install --prefix service
      - name: Test service
        run: npm test --prefix service